<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1424">
<title>GYM JBR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0E1424; --bg2:#121A2D; --card:#161F33; --card2:#1D2840; --line:#26324D; --line2:#33405F;
  --ink:#EEF2F8; --ink2:#C9D2E3; --muted:#8693AD;
  --acc:#FF6A3D; --acc-deep:#E2481D; --acc-soft:rgba(255,106,61,.14); --acc2:#8C3B25;
  --blue:#3CC8FF; --blue-deep:#1C9ECC; --blue-soft:rgba(60,200,255,.13);
  --vio:#9A8CFF; --vio-soft:rgba(154,140,255,.14);
  --ok:#5BE3A2; --ok-soft:rgba(91,227,162,.13); --warn:#FFC145; --warn-soft:rgba(255,193,69,.13);
  --c-push:#EA5A2C; --c-leg:#7A6CF0; --c-pull:#1C9ECC; --c-core:#BE850C;
  --fig:#1D2840; --fig2:#33405F; --body:#5D6A86; --body2:#3A4664;
  --r:20px; --r2:14px;
  --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:16px;line-height:1.42;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(104px + env(safe-area-inset-bottom)) env(safe-area-inset-left);
  background:radial-gradient(120% 60% at 85% -10%, rgba(255,106,61,.16), transparent 60%), radial-gradient(90% 50% at -10% 0%, rgba(60,200,255,.10), transparent 55%), var(--bg);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px}
h1{font-family:var(--cond);font-size:34px;font-weight:700;margin:2px 0 4px;letter-spacing:.005em;line-height:1}
h2{font-family:var(--cond);font-size:22px;font-weight:600;margin:28px 0 10px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--acc),var(--vio))}
h3{font-size:15px;margin:14px 0 6px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.small{font-size:13px}
.mono,.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.card{background:linear-gradient(180deg,var(--card2),var(--card) 70%);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{background:var(--card);box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap;border:1px solid rgba(255,106,61,.25)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:rgba(91,227,162,.25)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:rgba(255,193,69,.25)}
.pill.blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(60,200,255,.25)}
.pill.ghost{background:rgba(255,255,255,.04);color:var(--ink2);border-color:var(--line2)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{background:linear-gradient(135deg,#FF8A4C,var(--acc) 45%,var(--acc-deep));color:#fff;font-weight:700;padding:15px 16px;width:100%;font-size:17px;border-radius:16px;box-shadow:0 10px 24px -10px rgba(255,106,61,.7);letter-spacing:.01em;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.blue{background:linear-gradient(135deg,#6FDBFF,var(--blue) 45%,var(--blue-deep));box-shadow:0 10px 24px -10px rgba(60,200,255,.6);color:#062233}
.btn.sec{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line2);font-weight:600;box-shadow:none}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.btn:disabled{opacity:.45}
.link{background:none;color:var(--acc);padding:4px 0;font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg.c2{grid-template-columns:repeat(2,1fr)}
.seg button{background:transparent;padding:10px 4px;color:var(--ink2);font-weight:500;font-size:14px;border-radius:10px}
.seg button.on{background:var(--card2);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line2),0 4px 12px -4px rgba(0,0,0,.6)}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-name{font-family:var(--cond);font-weight:600;font-size:22px;line-height:1.1;letter-spacing:.01em}
.target{color:var(--muted);font-size:14px;margin-top:2px}
.load{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.load .lbl{font-size:13px;color:var(--muted);flex:1}
.step{width:44px;height:44px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font-size:22px;font-weight:600;border-radius:12px}
.load .val{min-width:88px;text-align:center;font-weight:700;font-size:18px}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.set{display:flex;flex-direction:column;gap:4px}
.set span{font-size:12px;color:var(--muted)}
input[type=number],input[type=text],input[type=date]{width:100%;font:inherit;font-family:var(--cond);font-size:20px;font-weight:600;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--ink)}
.set input{font-size:24px}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.how{font-size:14px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.note{font-size:13px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);border:1px solid rgba(255,193,69,.2)}
.note.blue{background:var(--blue-soft);color:var(--blue);border-color:rgba(60,200,255,.2)}
.done{opacity:.6}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;color:#062a1a;font-size:14px;font-weight:800;padding:0}
.box.on{background:var(--ok);border-color:var(--ok)}
.check .t{font-weight:600;font-size:15px}
.check .d{font-size:13px;color:var(--muted)}

/* Dock de navegación */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));background:rgba(22,31,51,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;z-index:5;box-shadow:0 18px 40px -12px rgba(0,0,0,.8)}
nav button{background:none;color:var(--muted);padding:8px 0 7px;font-weight:600;font-size:11.5px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em;transition:background .2s,color .2s}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink);background:linear-gradient(180deg,rgba(255,106,61,.24),rgba(255,106,61,.08));box-shadow:inset 0 0 0 1px rgba(255,106,61,.35)}
nav button.on svg{stroke:var(--acc)}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:rgba(29,40,64,.95);backdrop-filter:blur(12px);color:var(--ink);border:1px solid var(--line2);border-radius:99px;padding:8px 10px 8px 18px;display:none;align-items:center;gap:12px;z-index:6;box-shadow:0 12px 30px -10px rgba(0,0,0,.8)}
.timer.show{display:flex}
.timer.end{background:var(--ok);color:#062a1a}
.timer b{font-family:var(--cond);font-size:26px;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.08);color:inherit;border:1px solid var(--line2);padding:6px 12px;font-size:13px;border-radius:99px;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .n{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .t{font-size:12px;color:var(--muted);margin-top:4px}
.stat .dd{font-size:12px;font-weight:700}
.prog-row{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prog-row:last-child{border-bottom:0}
.prog-row .nm{font-weight:600;font-size:15px}
.prog-row .dt{font-size:13px;color:var(--muted)}
.hist-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist-item:last-child{border-bottom:0}
.hist-item .ln{color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.sum-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum-line:last-child{border-bottom:0}
textarea{width:100%;min-height:90px;font-family:var(--cond);font-size:13px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);color:var(--ink);padding:8px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
.modal{position:fixed;inset:0;background:rgba(4,8,18,.62);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.modal .sheet{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:26px 18px calc(20px + env(safe-area-inset-bottom));position:relative;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.modal .sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--line2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.gap{height:8px}
.field{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field .t{font-weight:600;font-size:15px}
.field .d{font-size:12px;color:var(--muted)}
.vol{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:14px;padding:5px 0}
.vol .bar{height:8px;border-radius:99px;background:rgba(0,0,0,.3);position:relative;overflow:hidden}
.vol .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc-deep),var(--acc));border-radius:99px}
.vol .bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--ink2);opacity:.5}
.fig{display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:3/4;border-radius:14px;background:var(--card2);overflow:hidden;position:relative;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:2px 7px;border-radius:7px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.run{position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:40;display:none;flex-direction:column;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
.run.show{display:flex}
.run.work{background:radial-gradient(120% 80% at 50% 30%,#FF7A45,#C93D16 70%);color:#fff}
.run.rest{background:radial-gradient(120% 80% at 50% 30%,#2A8FC4,#0E3D63 75%);color:#fff}
.run .tt{font-size:14px;opacity:.85;font-weight:600}
.run .lbl{font-family:var(--cond);font-size:42px;font-weight:700;margin-top:auto;line-height:1.05}
.run .cd{font-family:var(--cond);font-size:140px;font-weight:700;line-height:.95;margin:10px 0;font-variant-numeric:tabular-nums}
.run .nx{font-size:16px;opacity:.85;margin-bottom:auto}
.run .pb{height:8px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin:18px 0}
.run .pb i{display:block;height:100%;background:#fff;border-radius:99px}
.run .bt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.run .bt button{background:rgba(255,255,255,.16);color:inherit;padding:15px 0;font-weight:700;border:1px solid rgba(255,255,255,.22)}
.sug{border:1px solid rgba(255,106,61,.45);box-shadow:var(--shadow),0 0 0 4px rgba(255,106,61,.06)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.rings{display:flex;gap:16px;align-items:center;margin:12px 0 4px}
.ringbox{text-align:center}
.phasebox{margin-left:auto;text-align:right}
.exgrid{display:grid}
.exmini{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.exmini:last-child{border-bottom:0}
.exmini .nm{font-weight:600;font-size:15px}
.exmini .pic{background:var(--bg);border-radius:10px;flex:none}
.picbox{flex:none;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:16px;padding:4px;cursor:pointer;align-self:flex-start}
.pic{display:block}
.howgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;justify-items:center}
.howgrid .pic{background:rgba(0,0,0,.25);border-radius:14px}
.val .mono{font-weight:700;font-size:20px}
.val .kg{font-size:12px;color:var(--muted)}
.lvbar{display:flex;gap:4px;margin:10px 0}
.lvbar i{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.07)}
.lvbar i.on{background:linear-gradient(90deg,var(--blue-deep),var(--blue))}
.stepsbar{display:flex;gap:2px;height:14px;margin:10px 0 4px;border-radius:7px;overflow:hidden}
.stepsbar i.work{background:var(--acc)}
.stepsbar i.rest{background:var(--blue-deep)}
.timeline{padding:8px 14px 8px 20px}
.tl{position:relative;padding:7px 0 7px 18px;border-left:2px solid var(--line2)}
.tl .dot{position:absolute;left:-7px;top:12px;width:12px;height:12px;border-radius:99px;background:var(--acc);border:2px solid var(--card)}
.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.blue{background:var(--blue)}
.tl.past{opacity:.4}
.tl .nm{font-weight:600}
.tl.now .nm{color:var(--acc);font-weight:700}
.gauge{position:relative;height:10px;display:flex;margin:10px 0 4px;gap:2px}
.gauge i{flex:1}
.gauge .z1{background:rgba(91,227,162,.35);border-radius:99px 0 0 99px}.gauge .z2{background:rgba(255,193,69,.35)}.gauge .z3{background:rgba(255,106,61,.4);border-radius:0 99px 99px 0}
.gauge b{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.excard .ex-h{gap:10px}
.tech{margin-top:10px;display:grid;gap:8px}
.tstep{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px}
.tstep .tn{flex:none;width:24px;height:24px;border-radius:99px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.tstep.bad .tn{background:var(--warn);color:#2a1d00}
.bigpic{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:18px;display:flex;justify-content:center;padding:8px}
.mlist{align-self:center;margin-top:8px}
.mchip{display:inline-block;margin:3px 4px 0 0;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600}
.mchip.p{background:var(--acc);color:#fff}.mchip.q{background:var(--acc-soft);color:var(--acc);border:1px solid rgba(255,106,61,.3)}
.tgt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ok-soft);color:var(--ok);margin-bottom:8px;border:1px solid rgba(91,227,162,.2)}
.tgt b{font-size:15px}
.anat{display:block}.legend span::before{border:1px solid var(--line2)}
.excard.active{border:1px solid rgba(255,106,61,.6);box-shadow:var(--shadow),0 0 0 4px rgba(255,106,61,.08)}.focus{margin-top:10px}
.foco{margin-top:8px;padding:12px;border-radius:12px;background:var(--acc-soft);color:var(--ink);font-weight:600;font-size:15px;text-align:center;border:1px solid rgba(255,106,61,.25)}
.howto{margin-top:6px;padding:12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:14px}.howto ol{margin:0;padding-left:18px;display:grid;gap:6px}.tn2{width:24px;text-align:center;color:var(--acc);font-weight:700}
.wbox{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:150px}.wbox>div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}.wbox span{display:block;font-size:11px;color:var(--muted)}.wbox b{font-family:var(--cond);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.wbox .real b{color:var(--acc)}
.set.ok input{border-color:rgba(91,227,162,.6);background:var(--ok-soft);color:var(--ok)}
.chk{background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--ok);font-weight:700;font-size:13px;padding:7px 0;border-radius:10px}
.set.ok .chk{background:var(--ok);color:#062a1a;border-color:var(--ok)}
.picbox.col{display:flex;flex-direction:column;align-items:center;gap:2px}
.coach{position:fixed;inset:0;z-index:15;background:radial-gradient(110% 60% at 50% -10%,rgba(255,106,61,.18),transparent 60%),var(--bg);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));overflow:auto}
.coach.show{display:flex}
.ctop{margin-bottom:8px}
.cbody{flex:1;display:flex;flex-direction:column;gap:10px;max-width:560px;width:100%;margin:0 auto}
.cbody.rest{justify-content:center;text-align:center}
.ctitle{font-family:var(--cond);font-size:32px;font-weight:700;text-align:center;line-height:1.05}
.cbig{font-family:var(--cond);font-size:84px;font-weight:700;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.csteps{display:grid;gap:8px;padding-left:20px;font-size:16px;margin:6px 0}
.cvis{display:flex;justify-content:center;gap:8px;align-items:center}
.cfoot{display:grid;gap:8px;max-width:560px;width:100%;margin:10px auto 0}
.cbtn{background:linear-gradient(135deg,#FF8A4C,var(--acc) 45%,var(--acc-deep));color:#fff;font-weight:700;padding:16px;font-size:18px;border-radius:16px;box-shadow:0 10px 24px -10px rgba(255,106,61,.7)}
.cbtn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line2);font-weight:600;font-size:14px;padding:11px 12px;box-shadow:none}
.cfoot .row .cbtn{flex:1}
.step.big{width:58px;height:58px;font-size:28px}
.motiv{display:block}
.flame{width:66px;height:66px;border-radius:20px;background:linear-gradient(145deg,#FF8A4C,var(--acc-deep));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;box-shadow:0 10px 22px -10px rgba(255,106,61,.8)}
.flame b{font-family:var(--cond);font-size:32px;line-height:1}.flame span{font-size:10px;font-weight:600}
.achs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.ach:not(.on){filter:grayscale(1);opacity:.45}

let SILENT=false, LASTSAID="", LASTEND=0;
const FEM=/m[oó]nica|marisol|paulina|elvira|luc[ií]a|laura|helena|elena|sabina|conchita|esperanza|dalia|ximena|abril|paloma|isabel|ang[eé]lica|carmen|marta|sof[ií]a|ines|in[eé]s|carla|google espa|female|mujer/i;
const MAL=/jorge|juan|diego|pablo|[aá]lvaro|enrique|carlos|ra[uú]l|alonso|male|hombre|tom[aá]s|andr[eé]s/i;
const HQ=/natural|neural|online|premium|enhanced|mejorad|siri|wavenet/i;
function voiceScore(v){ let s=0; if(/^es[-_]ES/i.test(v.lang)) s+=30; else if(/^es/i.test(v.lang)) s+=12; else return -99;
  if(HQ.test(v.name)) s+=40; if(FEM.test(v.name)) s+=22; if(MAL.test(v.name)) s-=30; if(v.localService===false) s+=4; if(/compact|eloquence|novelty|bad news|bells/i.test(v.name)) s-=40; return s; }
function esVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a)); }catch(e){ return []; } }
function voices(){ const L=esVoices(), pick=(state&&state.prefs&&state.prefs.voiceName)||null; return (pick&&L.find(v=>v.name===pick))||L[0]||null; }
function speakNow(t,onStart,onFail,onEnd){
  if(useClips()&&clipSpeak(t,onStart,onEnd)) return;
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){ onFail&&onFail("no"); onEnd&&onEnd(); return; }
  try{
    const u=new SpeechSynthesisUtterance(t); u.lang="es-ES"; const v=voices(); if(v){ u.voice=v; u.lang=v.lang; } const PR=state.prefs||{}; u.rate=(PR.rate||1.15)*((C&&C.slow)||PR.slow?0.9:1); u.pitch=PR.pitch||1; LASTSAID=t; u.addEventListener&&u.addEventListener("end",()=>{ LASTEND=Date.now(); }); u.volume=1;
    let started=false; u.onstart=()=>{ started=true; voxOK=true; onStart&&onStart(); };
    u.onend=u.onerror=()=>{ const i=UTT.indexOf(u); if(i>=0) UTT.splice(i,1); onEnd&&onEnd(); };
    UTT.push(u); if(UTT.length>8) UTT.shift();
    try{ speechSynthesis.resume(); }catch(e){}
    speechSynthesis.speak(u);
    if(onFail) setTimeout(()=>{ if(!started&&!speechSynthesis.speaking) onFail("silencio"); },2500);
  }catch(e){ onFail&&onFail("error"); onEnd&&onEnd(); }
}
function showCue(t){ if(C&&C.cueEl){ C.cueEl.textContent=t; C.cueEl.classList.remove("pop"); void C.cueEl.offsetWidth; C.cueEl.classList.add("pop"); } }
function say(t,interrupt){
  if(SILENT) return; showCue(t);
  const on=C?C.voice:((state.prefs||{}).voice!==false); if(!on||!canSpeak()) return;
  try{ if(interrupt&&busy()){ hush(); setTimeout(()=>speakNow(t),90); return; } }catch(e){}
  speakNow(t);
}
function clearCoachTimers(){ if(!C) return; clearInterval(C.timer); C.cueTimers.forEach(clearTimeout); C.cueTimers=[]; C.qid=(C.qid||0)+1; }
/* Dice varias frases seguidas, esperando a que termine cada una */
function sayQueue(lines,onDone){
  if(!C) return; const id=C.qid=(C.qid||0)+1; let i=0;
  try{ if(busy()) hush(); }catch(e){}
  const next=()=>{ if(!C||C.qid!==id) return; if(i>=lines.length){ onDone&&onDone(); return; }
    const t=lines[i++]; showCue(t);
    if(!C.voice||!canSpeak()){ C.cueTimers.push(setTimeout(next,Math.min(2500,600+t.length*12))); return; }
    let done=false; const fin=()=>{ if(done) return; done=true; if(C&&C.qid===id) C.cueTimers.push(setTimeout(next,C.slow?1100:450)); };
    speakNow(t,null,null,fin); C.cueTimers.push(setTimeout(fin,(t.length/11)*1000+2500)); };
  setTimeout(next,140);
}

  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.05); g.gain.setValueAtTime(vol||0.08,t+dur-0.12); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
(function(){ let ev=null; const show=()=>{ if(!ev||document.getElementById("instbar")) return; const d=document.createElement("div"); d.id="instbar";
  d.setAttribute("style","position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:50;background:linear-gradient(135deg,#FF8A4C,#FF6A3D);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font:600 15px Barlow,system-ui;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)");
  d.innerHTML='<span style="flex:1">Instala GYM JBR como app en tu móvil</span><button id="instgo" style="background:#fff;color:#E2481D;border:0;border-radius:10px;padding:8px 12px;font:700 14px Barlow,system-ui">Instalar</button><button id="instx" style="background:none;border:0;color:#fff;font-size:20px">×</button>';
  document.body.append(d); document.getElementById("instgo").onclick=async()=>{ ev.prompt(); await ev.userChoice; ev=null; d.remove(); }; document.getElementById("instx").onclick=()=>d.remove(); };
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; show(); });
  window.addEventListener("appinstalled",()=>{ const d=document.getElementById("instbar"); if(d) d.remove(); }); })();
</script>
</body>
</html>
