name: Compilar app Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Modelo de voz en español
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q model.zip
          mkdir -p android/app/src/main/assets/model-es
          cp -r vosk-model-small-es-0.42/* android/app/src/main/assets/model-es/
          echo "es-0.42" > android/app/src/main/assets/model-es/uuid
          rm -rf model.zip vosk-model-small-es-0.42
      - name: Compilar
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../build.log
      - name: Publicar el APK en el repositorio
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GYM-JBR.apk
          git config user.name "jaimebr-gym"
          git config user.email "jaimebr-gym@users.noreply.github.com"
          git rm -q --cached build-error.log 2>/dev/null || true
          rm -f build-error.log
          git add GYM-JBR.apk; git add -A build-error.log 2>/dev/null || true
          git commit -m "App Android ${GITHUB_RUN_NUMBER}" || exit 0
          git pull --rebase -X theirs origin main || (git rebase --abort; git fetch origin main; git reset --soft origin/main; git commit -m "App Android ${GITHUB_RUN_NUMBER}")
          git push origin HEAD:main
      - name: Guardar el registro si falla
        if: failure()
        run: |
          git config user.name "jaimebr-gym"
          git config user.email "jaimebr-gym@users.noreply.github.com"
          tail -c 60000 build.log > build-error.log || echo "sin registro" > build-error.log
          git add build-error.log
          git commit -m "Registro de compilación ${GITHUB_RUN_NUMBER}"
          git pull --rebase origin main
          git push origin HEAD:main
